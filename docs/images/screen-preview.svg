<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
<title id="title">Insta360 Shutter screen preview</title>
<desc id="desc">Emulated ready state. Up changes mode, Left toggles screen, hold Right sleeps and OK triggers shutter. Fonts are approximate.</desc>
<rect width="128" height="64" fill="#ef9b25"/>
<g fill="#181300" stroke="#181300" stroke-width="1" shape-rendering="crispEdges">
<rect width="128" height="13"/>
<text x="3" y="10" fill="#ef9b25" stroke="none" font-family="monospace" font-size="9" font-weight="700" text-anchor="start">Insta360</text>
<text x="125" y="10" fill="#ef9b25" stroke="none" font-family="monospace" font-size="8" font-weight="400" text-anchor="end">Ready</text>
<text x="3" y="23" fill="#181300" stroke="none" font-family="monospace" font-size="8" font-weight="400" text-anchor="start">Up: mode</text>
<text x="3" y="35" fill="#181300" stroke="none" font-family="monospace" font-size="8" font-weight="400" text-anchor="start">Hold R: sleep</text>
<text x="3" y="49" fill="#181300" stroke="none" font-family="monospace" font-size="8" font-weight="400" text-anchor="start">Left: screen on/off</text>
<rect x="78.5" y="16.5" width="48" height="23" fill="none"/>
<text x="94" y="26" fill="#181300" stroke="none" font-family="monospace" font-size="9" font-weight="700" text-anchor="start">OK</text>
<text x="84" y="36" fill="#181300" stroke="none" font-family="monospace" font-size="8" font-weight="400" text-anchor="start">Shutter</text>
<path d="M0 52.5H128" fill="none"/>
<text x="64" y="63" fill="#181300" stroke="none" font-family="monospace" font-size="8" font-weight="400" text-anchor="middle">Back: exit</text>
</g></svg>
